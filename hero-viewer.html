<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dota 1 — Hero Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0f; color: #e0d8c8; font-family: 'Segoe UI', monospace; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
#topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #111118; border-bottom: 1px solid #2a2a3a; flex-shrink: 0; z-index: 10; }
#topbar h1 { font-size: 14px; color: #ffcc44; letter-spacing: 2px; text-transform: uppercase; }
.nav-btn { background: #1e1e2e; border: 1px solid #3a3a5a; color: #aaa; padding: 5px 14px; cursor: pointer; font-size: 12px; border-radius: 3px; transition: all 0.2s; }
.nav-btn:hover { background: #2a2a4a; color: #fff; border-color: #6666aa; }
#portrait-strip { display: flex; gap: 6px; padding: 8px 12px; background: #0d0d16; border-bottom: 1px solid #1a1a2a; flex-shrink: 0; overflow-x: auto; scrollbar-width: none; }
.portrait { flex-shrink: 0; width: 56px; height: 56px; border-radius: 4px; border: 2px solid #2a2a3a; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9px; text-align: center; background: #111120; color: #888; gap: 2px; }
.portrait .port-icon { font-size: 22px; line-height: 1; }
.portrait:hover { border-color: #5555aa; color: #ccc; }
.portrait.active { border-color: #ffcc44; color: #ffcc44; background: #1a1a2e; }
#main { display: flex; flex: 1; overflow: hidden; }
#viewport-wrap { flex: 0 0 auto; width: 55vw; position: relative; background: #07070f; border-right: 1px solid #1a1a2a; }
#hero-canvas { width: 100%; height: 100%; display: block; }
#viewport-overlay { position: absolute; bottom: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.anim-btn { background: rgba(10,10,20,0.85); border: 1px solid #333; color: #aaa; padding: 4px 10px; cursor: pointer; font-size: 11px; border-radius: 3px; transition: all 0.15s; }
.anim-btn:hover { border-color: #6666aa; color: #fff; }
.anim-btn.active { border-color: #ffcc44; color: #ffcc44; }
#announcer { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: bold; color: #ffcc44; text-shadow: 0 0 20px #ffcc44, 0 2px 4px #000; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; letter-spacing: 2px; }
#dmg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
.dmg-num { position: absolute; font-size: 18px; font-weight: bold; color: #fff; text-shadow: 0 0 8px currentColor; pointer-events: none; animation: floatUp 1.2s ease-out forwards; }
@keyframes floatUp { 0%{opacity:1;transform:translateY(0) scale(1)} 50%{opacity:1;transform:translateY(-30px) scale(1.2)} 100%{opacity:0;transform:translateY(-60px) scale(0.8)} }
#stats-panel { flex: 1; overflow-y: auto; padding: 12px; background: #09090f; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; scrollbar-color: #2a2a4a transparent; }
.panel-section { background: #111118; border: 1px solid #1e1e2e; border-radius: 4px; padding: 10px; }
.panel-section h3 { font-size: 11px; color: #6666aa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
#hero-title { font-size: 16px; color: #ffcc44; font-weight: bold; }
#hero-sub { font-size: 11px; color: #777; margin-top: 2px; }
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.bar-label { font-size: 10px; color: #888; width: 36px; flex-shrink: 0; }
.bar-track { flex: 1; height: 10px; background: #0d0d16; border-radius: 5px; overflow: hidden; border: 1px solid #1a1a2a; }
.bar-fill { height: 100%; border-radius: 5px; transition: width 0.4s; }
.bar-hp { background: linear-gradient(90deg, #1a8a1a, #2ecc2e); }
.bar-mp { background: linear-gradient(90deg, #1a3a9a, #3366ff); }
.bar-val { font-size: 10px; color: #aaa; width: 55px; text-align: right; }
.attrs { display: flex; gap: 8px; }
.attr-box { flex: 1; background: #0d0d16; border-radius: 4px; padding: 6px; text-align: center; border: 1px solid #1a1a2a; }
.attr-box.primary { border-color: #ffcc44; background: #151510; }
.attr-icon { font-size: 16px; }
.attr-val { font-size: 14px; font-weight: bold; color: #eee; }
.attr-gain { font-size: 9px; color: #777; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.stat-item { font-size: 10px; display: flex; justify-content: space-between; padding: 2px 4px; }
.stat-item span:first-child { color: #777; }
.stat-item span:last-child { color: #ccc; }
.slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.slider-label { font-size: 10px; color: #888; width: 60px; }
input[type=range] { flex: 1; height: 4px; accent-color: #6666aa; cursor: pointer; }
.slider-val { font-size: 10px; color: #ccc; width: 28px; text-align: right; }
.skill-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.skill-btn { background: #0d0d16; border: 1px solid #2a2a3a; border-radius: 4px; padding: 7px 8px; cursor: pointer; transition: all 0.15s; text-align: left; }
.skill-btn:hover { border-color: #5555aa; background: #111128; }
.skill-btn.active { border-color: #ffcc44; background: #15150a; }
.skill-key { font-size: 10px; color: #6666aa; font-weight: bold; }
.skill-name { font-size: 11px; color: #ccc; margin-top: 1px; }
.skill-meta { font-size: 9px; color: #666; margin-top: 2px; }
#skill-info { background: #0d0d16; border: 1px solid #2a2a3a; border-radius: 4px; padding: 8px; font-size: 10px; color: #aaa; line-height: 1.5; min-height: 40px; }
#skill-info .si-name { font-size: 12px; color: #ffcc44; margin-bottom: 4px; }
</style>
</head>
<body>
<div id="topbar">
  <button class="nav-btn" id="prevBtn">◀ PREV</button>
  <h1 id="heroNameTitle">LICH</h1>
  <button class="nav-btn" id="nextBtn">NEXT ▶</button>
</div>
<div id="portrait-strip" id="portraits"></div>
<div id="main">
  <div id="viewport-wrap">
    <canvas id="hero-canvas"></canvas>
    <div id="viewport-overlay">
      <button class="anim-btn active" data-anim="idle">Idle</button>
      <button class="anim-btn" data-anim="walk">Walk</button>
      <button class="anim-btn" data-anim="attack">Attack</button>
      <button class="anim-btn" data-anim="castQ">Cast Q</button>
      <button class="anim-btn" data-anim="castR">Cast R</button>
      <button class="anim-btn" data-anim="die">Die</button>
    </div>
    <div id="announcer"></div>
    <div id="dmg-overlay"></div>
  </div>
  <div id="stats-panel">
    <div class="panel-section">
      <div id="hero-title">LICH</div>
      <div id="hero-sub">Intelligence · Scourge · Undead</div>
    </div>
    <div class="panel-section">
      <h3>Vitals</h3>
      <div class="bar-row"><span class="bar-label">HP</span><div class="bar-track"><div class="bar-fill bar-hp" id="hpBar" style="width:100%"></div></div><span class="bar-val" id="hpVal">454 / 454</span></div>
      <div class="bar-row"><span class="bar-label">Mana</span><div class="bar-track"><div class="bar-fill bar-mp" id="mpBar" style="width:100%"></div></div><span class="bar-val" id="mpVal">403 / 403</span></div>
    </div>
    <div class="panel-section">
      <h3>Attributes</h3>
      <div class="attrs" id="attrsBox"></div>
    </div>
    <div class="panel-section">
      <h3>Stats</h3>
      <div class="stat-grid" id="statGrid"></div>
    </div>
    <div class="panel-section">
      <h3>Level &amp; Speed</h3>
      <div class="slider-row"><span class="slider-label">Level</span><input type="range" id="lvlSlider" min="1" max="25" value="1"><span class="slider-val" id="lvlVal">1</span></div>
      <div class="slider-row"><span class="slider-label">Atk Speed</span><input type="range" id="atkSlider" min="60" max="400" value="100"><span class="slider-val" id="atkVal">100</span></div>
    </div>
    <div class="panel-section">
      <h3>Skills</h3>
      <div class="skill-grid" id="skillGrid"></div>
      <div id="skill-info" style="margin-top:8px"><div class="si-name">Select a skill</div>Click Q/W/E/R or use keyboard</div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ─── HERO DATA ───────────────────────────────────────────────────────────────
const HEROES = [

      {key:'Q',name:'Dragon Blood',meta:'Passive',desc:'+3/6/9/12 HP regen/sec and +3/4/5/6 armor. Red corona pulses.',anim:'idle'},

    skills:[
      {key:'Q',name:'Shadowraze ×3',meta:'Mana 75 · CD 10s each · No-target',desc:'3 fixed razes at 200/450/700 range. 75/150/225/300 magic each.',anim:'castQ'},

      {key:'R',name:'Requiem of Souls',meta:'Mana 150–200 · CD 120–100s · Global',desc:'Wings OPEN. Soul lines explode outward then retract. (souls÷2)×80/120/160 dmg.',anim:'castR'},
    ]
  },
  { name:'Windrunner', sub:'Agility · Sentinel · Night Elf', primary:'agi', color:0x88ffcc,
    baseHP:492, hpLvl:19, baseMana:234, manaLvl:26,
    armor:1.1, range:600, ms:295, dmg:'36–46',
    str:15, strG:1.5, agi:21, agiG:2.9, int:18, intG:2.0,
    skills:[
      {key:'Q',name:'Shackleshot',meta:'Mana 90–120 · CD 15s · Unit-target',desc:'Arrow stuns target + nearby tree/unit for 0.75/1.5/2.25/3.0s.',anim:'castQ'},
      {key:'W',name:'Powershot',meta:'Mana 90–120 · CD 12s · Channel 1s',desc:'Charge up huge arrow. 340/480/620/760 magic, pierces all units in line.',anim:'castQ'},
      {key:'E',name:'Windrun',meta:'Mana 100 · CD 15–6s · 3s duration',desc:'+50% evasion, +50% ms for 3s. All projectiles miss.',anim:'castQ'},

    ]
  },
];

const PORTRAIT_ICONS = ['❄️','🎯','🐉','👻','🏹'];

// ─── MATERIAL HELPERS ────────────────────────────────────────────────────────
function stdMat(color, rough=0.75, metal=0) {
  return new THREE.MeshStandardMaterial({color, roughness:rough, metalness:metal});
}
function glowMat(color, intensity=2) {
  return new THREE.MeshStandardMaterial({color, emissive:new THREE.Color(color), emissiveIntensity:intensity, roughness:0.3, metalness:0});
}
function metalMat(color, metal=0.8, rough=0.25) {
  return new THREE.MeshStandardMaterial({color, metalness:metal, roughness:rough});
}
function transMat(color, opacity=0.4) {
  return new THREE.MeshStandardMaterial({color, transparent:true, opacity, roughness:0.5, side:THREE.DoubleSide});
}

// ─── THREE.JS SETUP ───────────────────────────────────────────────────────────
const canvas = document.getElementById('hero-canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07070f);
scene.fog = new THREE.Fog(0x07070f, 12, 30);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
camera.position.set(0, 1.8, 3.6);
camera.lookAt(0, 1.2, 0);

// ─── LIGHTING ────────────────────────────────────────────────────────────────
const hemi = new THREE.HemisphereLight(0x223355, 0x0a0a10, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(3, 6, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 30;
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4;
sun.shadow.camera.top = 6; sun.shadow.camera.bottom = -2;
scene.add(sun);
const fill1 = new THREE.PointLight(0x3355ff, 0.6, 10);
fill1.position.set(-3,2,1); scene.add(fill1);
const fill2 = new THREE.PointLight(0xff5533, 0.4, 10);
fill2.position.set(3,1,-2); scene.add(fill2);
const rim = new THREE.PointLight(0xaaccff, 0.5, 8);
rim.position.set(0, 4, -3); scene.add(rim);

// ─── SCENE OBJECTS ────────────────────────────────────────────────────────────
const platformGeo = new THREE.CylinderGeometry(1.5,1.5,0.08,32);
const platform = new THREE.Mesh(platformGeo, stdMat(0x1a1a2a,0.9,0.1));
platform.receiveShadow = true;
platform.position.y = -0.04;
scene.add(platform);

const ringGeo = new THREE.TorusGeometry(1.5,0.025,8,64);
const ringMesh = new THREE.Mesh(ringGeo, glowMat(0x4444ff,1.5));
ringMesh.rotation.x = Math.PI/2;
ringMesh.position.y = 0.01;
scene.add(ringMesh);

const grid = new THREE.GridHelper(10,20,0x111122,0x0d0d1a);
grid.position.y = -0.04;
scene.add(grid);

// Dummy target
const dummyGroup = new THREE.Group();
dummyGroup.position.set(1.4,0,0);
const dummyBody = new THREE.Mesh(new THREE.BoxGeometry(0.3,0.6,0.3), stdMat(0x226633,0.9));
dummyBody.position.y = 0.34; dummyBody.castShadow = true;
const dummyHead = new THREE.Mesh(new THREE.SphereGeometry(0.18,8,6), stdMat(0x226633,0.9));
dummyHead.position.y = 0.85; dummyHead.castShadow = true;
dummyGroup.add(dummyBody,dummyHead);
scene.add(dummyGroup);

// Hero glow light
const heroLight = new THREE.PointLight(0x00ffcc, 1.0, 4);
heroLight.position.set(0,1.5,0.5);
scene.add(heroLight);

// ─── 3D FACE HELPERS ──────────────────────────────────────────────────────────
// Pure geometry only — no canvas/textures. All face features are proper meshes.

// ── 3D FACE EXTRAS: brow ridge tube, human ear, elven ear ─────────────────────

function addBrowRidge(g, side, x, y, color) {
  // A subtle half-cylinder ridge above each eye brow
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(side*(x-.065), y, .155),
    new THREE.Vector3(side*(x-.02),  y+.012, .185),
    new THREE.Vector3(side*(x+.02),  y+.013, .186),
    new THREE.Vector3(side*(x+.055), y+.004, .166),
  ]);
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve,8,.016,5,false),
    stdMat(color,.65)
  );
  g.add(mesh);
}

function addHumanEar(g, side, yOffset, color) {
  // Ear as LatheGeometry half-dome + TubeGeometry inner helix
  const earPts=[[0,0],[.022,.02],[.036,.06],[.034,.10],[.024,.14],[.008,.16],[0,.14]]
    .map(([x,y])=>new THREE.Vector2(x,y));
  const earMain = new THREE.Mesh(
    new THREE.LatheGeometry(earPts,6,0,Math.PI),
    stdMat(color,.72)
  );
  earMain.rotation.y = side>0 ? 0 : Math.PI;
  const helixCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0,.02,.001), new THREE.Vector3(.013,.06,.008),
    new THREE.Vector3(.010,.10,.006), new THREE.Vector3(0,.12,.001)
  ]);
  const helix = new THREE.Mesh(
    new THREE.TubeGeometry(helixCurve,5,.005,4,false),
    stdMat(color*.88,.72)
  );
  const eg = new THREE.Group();
  eg.add(earMain); eg.add(helix);
  eg.position.set(side*.205, yOffset, .02);
  eg.rotation.y = side>0 ? -Math.PI*.38 : Math.PI*.38+Math.PI;
  eg.scale.setScalar(.82);
  g.add(eg);
}

function addElvenEar(g, side, yOffset, color) {
  const earShape = new THREE.Shape();
  earShape.moveTo(0,0);
  earShape.bezierCurveTo(.042,.04,.058,.10,.020,.22); // pointed tip
  earShape.lineTo(-.020,.22);
  earShape.bezierCurveTo(-.058,.10,-.042,.04,0,0);
  earShape.closePath();
  const earMesh = new THREE.Mesh(
    new THREE.ExtrudeGeometry(earShape,{depth:.024,bevelEnabled:true,bevelSize:.005,bevelThickness:.005,bevelSegments:1}),
    stdMat(color,.65)
  );
  // Inner ear canal hint
  const canal = new THREE.Mesh(
    new THREE.CylinderGeometry(.008,.008,.02,5),
    stdMat(color*.75,.8)
  );
  canal.position.set(0,.06,.022);
  const eg = new THREE.Group();
  eg.add(earMesh); eg.add(canal);
  eg.position.set(side*.196, yOffset, .04);
  eg.rotation.y = side>0 ? -Math.PI*.32 : Math.PI*(1+.32);
  g.add(eg);
}

// ─── HERO BUILDERS ────────────────────────────────────────────────────────────

function buildLich() {
  const g = new THREE.Group();
  const parts = {};

  // Robe (LatheGeometry, 14 points, 16 sides)
  const robePoints = [
    [0.58,0.00],[0.61,0.04],[0.57,0.10],[0.51,0.20],
    [0.45,0.32],[0.40,0.44],[0.34,0.56],[0.27,0.68],
    [0.22,0.80],[0.19,0.92],[0.16,1.02],[0.14,1.10],
    [0.13,1.14],[0.12,1.18]
  ].map(([x,y])=>new THREE.Vector2(x,y));
  const robe = new THREE.Mesh(new THREE.LatheGeometry(robePoints,16), stdMat(0x1a0a2e,0.9,0.05));
  robe.castShadow = true; robe.position.y = 0;
  g.add(robe);

  // Robe trim
  const trimPts = [[0.595,0.00],[0.625,0.02],[0.61,0.06],[0.58,0.08]].map(([x,y])=>new THREE.Vector2(x,y));
  const trim = new THREE.Mesh(new THREE.LatheGeometry(trimPts,16), stdMat(0x0d2244,0.8,0.2));
  g.add(trim);

  // Vertebrae above collar
  for(let i=0;i<4;i++){
    const v = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.04,0.05,6), stdMat(0xddccaa,0.7));
    v.position.set(0, 1.22+i*0.058, 0);
    g.add(v);
  }

  // Skull (high-poly, slightly squished)
  const skullGeo = new THREE.SphereGeometry(0.22,20,16);
  const skull = new THREE.Mesh(skullGeo, stdMat(0xe8ddc8,0.78));
  skull.scale.set(1,0.92,0.95); skull.position.set(0,1.54,0);
  skull.castShadow = true; g.add(skull); parts.skull = skull;

  // Nasal cavity — two dark oval hollows
  for(const s of[-1,1]){
    const nc = new THREE.Mesh(new THREE.SphereGeometry(.022,7,5), stdMat(0x060606,1));
    nc.scale.set(1.1,.8,.55); nc.position.set(s*.036,1.455,.195); g.add(nc);
  }
  // Nasal bridge bone (thin tube)
  const nasalCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0,1.52,.17), new THREE.Vector3(0,1.49,.19), new THREE.Vector3(0,1.46,.20)
  ]);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(nasalCurve,4,.010,5,false), stdMat(0xd8c8b0,.75)));
  // Teeth row — 5 small cylinders
  for(let i=0;i<5;i++){
    const t = new THREE.Mesh(new THREE.CylinderGeometry(.010,.012,.038,5), stdMat(0xddd5c0,.6));
    t.position.set((i-2)*.026, 1.385, .195); t.rotation.x = Math.PI/2; g.add(t);
  }

  // Jaw (ExtrudeGeometry)
  const jawShape = new THREE.Shape();
  jawShape.moveTo(-0.14,0); jawShape.lineTo(-0.16,-0.04); jawShape.lineTo(-0.12,-0.10);
  jawShape.lineTo(0,-0.11); jawShape.lineTo(0.12,-0.10); jawShape.lineTo(0.16,-0.04);
  jawShape.lineTo(0.14,0); jawShape.closePath();
  const jaw = new THREE.Mesh(new THREE.ExtrudeGeometry(jawShape,{depth:0.12,bevelEnabled:true,bevelSize:0.012,bevelThickness:0.012,bevelSegments:2}), stdMat(0xe0d4bc,0.8));
  jaw.rotation.x = Math.PI/2; jaw.position.set(-0.06,1.36,0.05); g.add(jaw);

  // Zygomatic arches (cheekbone tubes)
  for(const s of[-1,1]){
    const zc = new THREE.CatmullRomCurve3([
      new THREE.Vector3(s*.16,1.55,.12), new THREE.Vector3(s*.20,1.50,.14),
      new THREE.Vector3(s*.22,1.44,.10), new THREE.Vector3(s*.20,1.38,.06)
    ]);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(zc,6,.012,5,false), stdMat(0xd0c0a8,.8)));
  }

  // 3D eye sockets (deep) + glowing point lights
  for(const s of[-1,1]){
    const socket = new THREE.Mesh(new THREE.SphereGeometry(0.058,10,8), stdMat(0x080808,1.0));
    socket.scale.set(1,.55,.65); socket.position.set(s*.09,1.58,.14); g.add(socket);
    // Glowing iris sphere (adds depth alongside texture)
    const iris = new THREE.Mesh(new THREE.SphereGeometry(0.038,8,6), glowMat(0x00ffcc,3.5));
    iris.position.set(s*.09,1.58,.195); g.add(iris);
    // Tiny point light per eye
    const el = new THREE.PointLight(0x00ffcc,.4,1.2);
    el.position.set(s*.09,1.58,.22); g.add(el);
  }

  // Shoulder spikes (LatheGeometry, 7 points, 6 sides)
  const spikeProfile = [[0,0],[0.04,0.02],[0.05,0.06],[0.04,0.12],[0.03,0.18],[0.015,0.22],[0,0.24]].map(([x,y])=>new THREE.Vector2(x,y));
  for(let s of[-1,1]){
    for(let i=0;i<3;i++){
      const sp = new THREE.Mesh(new THREE.LatheGeometry(spikeProfile,6), stdMat(0xccbbaa,0.7));
      sp.position.set(s*(0.28+i*0.05), 1.26-i*0.03, 0.02);
      sp.rotation.z = s*(0.3+i*0.15);
      sp.rotation.x = -0.2;
      g.add(sp);
    }
  }

  // Arms (TubeGeometry along CatmullRomCurve3)
  for(let s of[-1,1]){
    const armCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(s*0.18, 1.18, 0.02),
      new THREE.Vector3(s*0.28, 1.10, 0.06),
      new THREE.Vector3(s*0.34, 0.96, 0.04),
      new THREE.Vector3(s*0.30, 0.82, 0.08),
      new THREE.Vector3(s*0.26, 0.72, 0.12),
    ]);
    const armMesh = new THREE.Mesh(new THREE.TubeGeometry(armCurve,10,0.036,7,false), stdMat(0xd4c8b0,0.85));
    armMesh.castShadow = true;
    if(s===1){ parts.armR = armMesh; } else { parts.armL = armMesh; }
    g.add(armMesh);

    // Fingers (4 per hand, 3 segments each)
    for(let f=0;f<4;f++){
      for(let seg=0;seg<3;seg++){
        const len = 0.06-seg*0.01;
        const fg = new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.01,len,5), stdMat(0xccbba0,0.85));
        fg.position.set(s*(0.28+f*0.018), 0.64-seg*0.055, 0.12+f*0.01);
        fg.rotation.z = s*(0.2+f*0.08);
        fg.rotation.x = 0.3+seg*0.1;
        g.add(fg);
      }
    }
  }

  // Staff shaft
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.032,1.3,7), metalMat(0x3a2a1a,0.3,0.7));
  shaft.position.set(0.34,0.72,0.08); shaft.rotation.z = 0.12;
  shaft.castShadow = true; g.add(shaft);

  // Staff top ornament (LatheGeometry, 11 points, 8 sides)
  const ornPts = [[0,0],[0.05,0.02],[0.08,0.05],[0.09,0.09],[0.07,0.14],[0.05,0.18],[0.06,0.22],[0.08,0.26],[0.07,0.30],[0.04,0.32],[0,0.33]].map(([x,y])=>new THREE.Vector2(x,y));
  const orn = new THREE.Mesh(new THREE.LatheGeometry(ornPts,8), metalMat(0x8866aa,0.4,0.7));
  orn.position.set(0.36,1.35,0.08); orn.rotation.z = 0.12;
  g.add(orn);

  // Gem (OctahedronGeometry glowing)
  const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.12,1), glowMat(0x00ffee,3));
  gem.position.set(0.37,1.52,0.09);
  g.add(gem); parts.gem = gem;

  // Ice orb core + shell
  const iceOrb = new THREE.Mesh(new THREE.IcosahedronGeometry(0.11,1), glowMat(0x88eeff,2));
  iceOrb.position.set(-0.1,1.3,0.28);
  g.add(iceOrb); parts.iceOrb = iceOrb;
  const iceShell = new THREE.Mesh(new THREE.SphereGeometry(0.15,12,10), transMat(0xaaddff,0.25));
  iceShell.position.copy(iceOrb.position);
  g.add(iceShell); parts.iceShell = iceShell;

  // Hero glow color
  parts.glowColor = 0x00ffcc;
  parts.type = 'lich';
  return {group:g, parts};
}

    const hc = new THREE.CatmullRomCurve3([
      new THREE.Vector3(s*.241,1.17,.02), new THREE.Vector3(s*.243,1.14,.04),

    ]);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(hc,4,.008,5,false), stdMat(0xc09060,.8)));

    sock.scale.set(1,.68,.45); sock.position.set(s*.093,1.18,.182); g.add(sock);
    // Sclera
    const wh = new THREE.Mesh(new THREE.SphereGeometry(.052,10,8), new THREE.MeshStandardMaterial({color:0xfefef5,roughness:.35}));

    hi.position.set(s*.082,1.191,.248); g.add(hi);

  // Big gnome nose (LatheGeometry, 9 points)

  const feather = new THREE.Mesh(new THREE.TubeGeometry(featherCurve,8,0.012,5,false), stdMat(0xddcc88,0.6));
  g.add(feather);

  armRPivot.add(armR); g.add(armRPivot); parts.armR = armRPivot;

  const armLPivot = new THREE.Group();
  armLPivot.position.set(-0.22,1.08,0);
  const armLCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0,-0.02,0),new THREE.Vector3(-0.04,-0.12,0.04),new THREE.Vector3(-0.08,-0.22,0.10),new THREE.Vector3(-0.14,-0.30,0.18)
  ]);
  const armL = new THREE.Mesh(new THREE.TubeGeometry(armLCurve,8,0.05,6,false), stdMat(0x8b5e3c,0.8));

  armLPivot.add(armL); g.add(armLPivot); parts.armL = armLPivot;

  // Rifle group
  const rifleGroup = new THREE.Group();
  rifleGroup.position.set(0.2,0.92,0.22);

  // Barrel (TubeGeometry, 10 segs, 7 sides)

  const barrel = new THREE.Mesh(new THREE.TubeGeometry(barrelCurve,10,0.022,7,false), metalMat(0x445566,0.3,0.85));

  const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.26,8), metalMat(0x223344,0.3,0.9));
  scope.rotation.x = Math.PI/2; scope.position.set(0,0.055,0.18); rifleGroup.add(scope);
  // Scope lenses
  for(let lz of[0.04,0.30]){
    const lens = new THREE.Mesh(new THREE.CircleGeometry(0.04,8), stdMat(0x223355,0.2,0.2));
    lens.rotation.x = Math.PI/2; lens.position.set(0,0.055,lz); rifleGroup.add(lens);
  }
  // Trigger guard
  const tgCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0,-0.01,-0.04),new THREE.Vector3(0.01,-0.06,-0.02),
    new THREE.Vector3(0,-0.08,0.02),new THREE.Vector3(0,-0.04,0.06)
  ]);
  const tg = new THREE.Mesh(new THREE.TubeGeometry(tgCurve,6,0.008,5,false), metalMat(0x334455,0.3,0.8));
  rifleGroup.add(tg);
  // Magazine
  const mag = new THREE.Mesh(new THREE.BoxGeometry(0.04,0.10,0.04), metalMat(0x223344,0.35,0.8));
  mag.position.set(0,-0.08,0.10); rifleGroup.add(mag);
  // Bipod
  for(let s of[-1,1]){
    const bi = new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,0.12,4), metalMat(0x334455,0.3,0.8));
    bi.position.set(s*0.028,  -0.06, 0.68); bi.rotation.z = s*0.5; rifleGroup.add(bi);
  }
  // Muzzle flash
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.08,8,6), glowMat(0xffee44,4));
  muzzle.position.set(0,-0.04,0.9); muzzle.visible = false; rifleGroup.add(muzzle);
  parts.muzzle = muzzle;

  g.add(rifleGroup); parts.rifle = rifleGroup;

  parts.glowColor = 0xffcc00;
  parts.type = 'sniper';
  return {group:g, parts};
}

  for(let i=0;i<capePos.count;i++){

  cape.position.set(0,0.88,-0.28); cape.castShadow = true;
  g.add(cape); parts.cape = cape;

  parts.glowColor = 0xff4400;
  parts.type = 'dragonknight';
  return {group:g, parts};
}

function buildShadowFiend() {

  for(const s of[-1,1]){
    const bc = new THREE.CatmullRomCurve3([
      new THREE.Vector3(s*.04,1.40,.16), new THREE.Vector3(s*.09,1.42,.16),
      new THREE.Vector3(s*.15,1.38,.11), new THREE.Vector3(s*.17,1.32,.07)
    ]);

  // Visible fang geometry (protruding below lip line)

      new THREE.Vector3(s*.045,1.19,.18), new THREE.Vector3(s*.048,1.14,.185),

      const ribCurve = new THREE.CatmullRomCurve3([

  // Arm pivots

    // Blade glow

    bladeGlowShape.moveTo(0.005,0.02);
    bladeGlowShape.bezierCurveTo(-0.02,0.22,-0.03,0.44,0.0,0.65);
    bladeGlowShape.lineTo(0.02,0.66);
    bladeGlowShape.bezierCurveTo(0.04,0.46,0.05,0.22,0.02,0.02);
    bladeGlowShape.closePath();
    const bladeGlow = new THREE.Mesh(new THREE.ExtrudeGeometry(bladeGlowShape,{depth:0.008,bevelEnabled:false}), glowMat(0xff2200,1.5));
    bladeGlow.position.set(s*0.22,0.64,0.165); bladeGlow.rotation.z = s*0.2;
    g.add(bladeGlow);
  }

  // Soul orbs (12 IcosahedronGeometry orbiting)
  parts.soulOrbs = [];
  for(let i=0;i<12;i++){
    const orb = new THREE.Mesh(new THREE.IcosahedronGeometry(0.065,0), glowMat(0xff4400,2.5));
    orb.visible = i < 8;
    orb.userData.angle = (i/12)*Math.PI*2;

  for(let i=0;i<8;i++){

    g.add(mist);
  }

  parts.glowColor = 0xff2200;
  parts.type = 'shadowfiend';
  return {group:g, parts};
}

      new THREE.Vector3(s*0.08,-0.20,0.08),new THREE.Vector3(s*0.12,-0.30,0.12)
    ]);
    const arm = new THREE.Mesh(new THREE.TubeGeometry(armCurve,8,0.038,6,false), stdMat(0xddc49a,0.7));
    arm.castShadow = true; pivot.add(arm); g.add(pivot);
    if(s===1){parts.armR=pivot;}else{parts.armL=pivot;}
  }

  // Longbow (TubeGeometry along arc) — most important
  const bowGroup = new THREE.Group();
  bowGroup.position.set(0.26,0.22,0.08);
  const bowCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0,-0.55,0),new THREE.Vector3(0.12,-0.35,0.04),
    new THREE.Vector3(0.16,0,0.06),new THREE.Vector3(0.12,0.35,0.04),
    new THREE.Vector3(0,0.55,0),
  ]);
  const bow = new THREE.Mesh(new THREE.TubeGeometry(bowCurve,16,0.022,6,false), stdMat(0x5c3a1e,0.7));
  bowGroup.add(bow);
  // Bow recurve tips
  for(let s of[-1,1]){
    const tipCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0,s*0.55,0),new THREE.Vector3(-0.04,s*0.60,0.02),new THREE.Vector3(-0.06,s*0.58,0.04)
    ]);
    const tip = new THREE.Mesh(new THREE.TubeGeometry(tipCurve,4,0.014,5,false), stdMat(0x5c3a1e,0.7));
    bowGroup.add(tip);
  }
  // Bowstring (thin TubeGeometry)
  const strCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.06,-0.58,0.04),new THREE.Vector3(-0.04,0,0.08),new THREE.Vector3(-0.06,0.58,0.04)
  ]);
  const str = new THREE.Mesh(new THREE.TubeGeometry(strCurve,6,0.004,4,false), stdMat(0xddccaa,0.5));
  bowGroup.add(str);
  // Bow rune glow
  const bowGlow = new THREE.Mesh(new THREE.TubeGeometry(bowCurve,16,0.026,6,false), glowMat(0x44ff88,0.3));
  bowGroup.add(bowGlow);
  g.add(bowGroup); parts.bow = bowGroup;

  // Quiver (LatheGeometry)
  const quiverPts = [[0,0],[0.048,0.02],[0.058,0.10],[0.056,0.20],[0.052,0.30],[0.06,0.34],[0.08,0.36],[0.08,0.38]].map(([x,y])=>new THREE.Vector2(x,y));
  const quiver = new THREE.Mesh(new THREE.LatheGeometry(quiverPts,8), stdMat(0x3d2a0e,0.85));
  quiver.position.set(-0.20,0.60,-0.12); quiver.rotation.z = 0.2; g.add(quiver);
  // Arrows in quiver
  for(let i=0;i<3;i++){
    const arw = new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,0.38,5), stdMat(0x8b5c1e,0.7));
    arw.position.set(-0.20+i*0.015,0.82,-0.12); arw.rotation.z = 0.2+i*0.05; g.add(arw);
    const head = new THREE.Mesh(new THREE.ConeGeometry(0.012,0.04,5), metalMat(0xaaaaaa,0.2,0.9));
    head.position.set(-0.20+i*0.015,1.02,-0.12); head.rotation.z = 0.2+i*0.05; g.add(head);
  }

  // Cloak (PlaneGeometry with flutter)
  const cloakGeo = new THREE.PlaneGeometry(0.4,0.7,4,8);
  const cloakPos = cloakGeo.attributes.position;
  for(let i=0;i<cloakPos.count;i++){
    const x=cloakPos.getX(i), y=cloakPos.getY(i);
    cloakPos.setZ(i, Math.sin(x*4)*0.02+Math.sin(y*3)*0.03);
  }
  cloakGeo.computeVertexNormals();
  const cloak = new THREE.Mesh(cloakGeo, stdMat(0x1e3a12,0.85));
  cloak.position.set(0,0.60,-0.20); g.add(cloak);

  // Wind wisps
  parts.wisps = [];
  for(let i=0;i<4;i++){
    const wisp = new THREE.Mesh(new THREE.IcosahedronGeometry(0.06,0), glowMat(0x44ffcc,2.5));
    wisp.userData.angle = (i/4)*Math.PI*2;
    wisp.userData.radius = 0.5;
    wisp.userData.height = 0.8+i*0.2;
    g.add(wisp); parts.wisps.push(wisp);
  }

  parts.glowColor = 0x88ffcc;
  parts.type = 'windrunner';
  return {group:g, parts};
}

// ─── HERO MANAGEMENT ─────────────────────────────────────────────────────────
const BUILDERS = [buildLich, buildSniper, buildDragonKnight, buildShadowFiend, buildWindrunner];
let heroObjects = [];
let currentHero = 0;
let currentAnim = 'idle';
let animTime = 0;
let attackSpeedMult = 1.0;

function buildAllHeroes() {
  heroObjects.forEach(h => { if(h) scene.remove(h.group); });
  heroObjects = BUILDERS.map(b => b());
  heroObjects.forEach((h,i) => {
    h.group.visible = (i === currentHero);
    scene.add(h.group);
  });
}

function showHero(idx) {
  heroObjects.forEach((h,i) => { h.group.visible = (i===idx); });
  currentHero = idx;
  const hero = HEROES[idx];
  // Update hero light color
  heroLight.color.setHex(hero.color);
  ringMesh.material = glowMat(hero.color, 1.5);
  updateUI();
  updatePortraits();
  setAnim('idle');
}

// ─── ANIMATION ────────────────────────────────────────────────────────────────
let isAutoRotate = false;
let cameraTheta = 0, cameraPhi = 0.3, cameraDist = 3.6;
let isDragging = false, lastMX = 0, lastMY = 0;

function setAnim(name) {
  currentAnim = name;
  animTime = 0;
  document.querySelectorAll('.anim-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.anim === name);
  });
  isAutoRotate = (name === 'idle');
}

function animateHero(dt) {
  const h = heroObjects[currentHero];
  if(!h) return;
  const p = h.parts;
  animTime += dt * attackSpeedMult;
  const t = animTime;
  const sin = Math.sin, cos = Math.cos;

  if(currentAnim === 'idle') {
    // Gentle breathing/bobbing
    h.group.position.y = sin(t*1.2)*0.015;
    if(p.armR) p.armR.rotation.x = sin(t*1.2)*0.04;
    if(p.armL) p.armL.rotation.x = sin(t*1.2+Math.PI)*0.04;
    if(p.skull) { p.skull.rotation.y = sin(t*0.8)*0.05; p.skull.position.y = 1.54+sin(t*1.2)*0.008; }
    if(p.gem) { p.gem.rotation.y = t*1.5; p.gem.rotation.x = sin(t*0.7)*0.3; }
    if(p.iceOrb) { p.iceOrb.position.x = -0.10+sin(t*1.1)*0.04; p.iceOrb.rotation.y = t*2; }
    if(p.iceShell) { p.iceShell.position.x = p.iceOrb.position.x; p.iceShell.rotation.y = -t*1.5; }
    if(p.wingL) { p.wingL.rotation.z = sin(t*1.0)*0.05; }
    if(p.wingR) { p.wingR.rotation.z = sin(t*1.0)*-0.05; }
    if(p.soulOrbs) p.soulOrbs.forEach((o,i) => {
      if(!o.visible) return;
      const a = o.userData.angle + t*1.2;
      o.position.set(sin(a)*o.userData.radius, o.userData.height+sin(t+i)*0.1, cos(a)*o.userData.radius);
    });
    if(p.wisps) p.wisps.forEach((w,i) => {
      const a = w.userData.angle + t*(0.8+i*0.1);
      w.position.set(sin(a)*w.userData.radius, w.userData.height+sin(t*1.5+i)*0.12, cos(a)*w.userData.radius);
    });
    if(p.cape) p.cape.rotation.z = sin(t*0.9)*0.04;
    if(p.bow) p.bow.rotation.z = sin(t*0.9)*0.03;
  }
  else if(currentAnim === 'walk') {
    h.group.position.y = Math.abs(sin(t*4))*0.04;
    if(p.armR) p.armR.rotation.x = sin(t*4)*0.35;
    if(p.armL) p.armL.rotation.x = sin(t*4+Math.PI)*0.35;
    if(p.legR) p.legR.rotation.x = sin(t*4)*0.4;
    if(p.legL) p.legL.rotation.x = sin(t*4+Math.PI)*0.4;
    if(p.cape) p.cape.rotation.x = sin(t*4)*0.08+0.05;
    if(p.bow) p.bow.position.z = 0.08+sin(t*4)*0.02;
    if(p.skull) p.skull.rotation.y = sin(t*2)*0.06;
    if(p.soulOrbs) p.soulOrbs.forEach((o,i) => {
      if(!o.visible) return;
      const a = o.userData.angle + t*2.5;
      o.position.set(sin(a)*o.userData.radius, o.userData.height+sin(t+i)*0.08, cos(a)*o.userData.radius);
    });
    if(p.wisps) p.wisps.forEach((w,i) => {
      const a = w.userData.angle + t*(1.5+i*0.1);
      w.position.set(sin(a)*w.userData.radius, w.userData.height+sin(t*2+i)*0.1, cos(a)*w.userData.radius);
    });
  }
  else if(currentAnim === 'attack') {
    const cycle = (t % 1.0) / 1.0;
    if(cycle < 0.3) {
      if(p.armR) p.armR.rotation.x = -sin(cycle/0.3*Math.PI)*0.6;
    } else if(cycle < 0.5) {
      const f = (cycle-0.3)/0.2;
      if(p.armR) p.armR.rotation.x = -sin((1-f)*Math.PI)*0.6;
      if(cycle > 0.35 && cycle < 0.45) {
        if(p.muzzle) { p.muzzle.visible = true; setTimeout(()=>{if(p.muzzle)p.muzzle.visible=false;},80); }
        // spawn arrow for ranged heroes
        if(p.type==='sniper' && Math.floor(t*10)%10===3) spawnBullet();
        if(p.type==='windrunner' && Math.floor(t*10)%10===3) spawnArrow();
      }
    } else {
      if(p.armR) p.armR.rotation.x += (0-p.armR.rotation.x)*0.15;
    }
    h.group.position.y = Math.abs(sin(t*2))*0.015;
    if(p.soulOrbs) p.soulOrbs.forEach((o,i) => {
      if(!o.visible) return;
      const a = o.userData.angle + t*2.0;
      o.position.set(sin(a)*o.userData.radius, o.userData.height+sin(t+i)*0.08, cos(a)*o.userData.radius);
    });
  }
  else if(currentAnim === 'castQ') {
    const cycle = (t % 1.2) / 1.2;
    if(p.armL) p.armL.rotation.x = sin(cycle*Math.PI)*-0.8;
    if(p.armR) p.armR.rotation.x = sin(cycle*Math.PI)*0.3;
    h.group.position.y = sin(t*2)*0.02;
    if(p.skull) p.skull.rotation.y = sin(t*3)*0.1;
    if(p.soulOrbs) p.soulOrbs.forEach((o,i) => {
      if(!o.visible) return;
      const a = o.userData.angle + t*3.0;
      o.position.set(sin(a)*o.userData.radius, o.userData.height+sin(t+i)*0.1, cos(a)*o.userData.radius);
    });
  }
  else if(currentAnim === 'castR') {
    if(p.armR) p.armR.rotation.x = sin(t*3)*0.5-0.3;
    if(p.armL) p.armL.rotation.x = sin(t*3+1)*0.5-0.3;
    h.group.position.y = Math.abs(sin(t*3))*0.04;
    h.group.rotation.y = sin(t*1.5)*0.1;
    if(p.wingL) p.wingL.rotation.z = sin(t*2)*0.25+0.2;
    if(p.wingR) p.wingR.rotation.z = -sin(t*2)*0.25-0.2;
    if(p.soulOrbs) p.soulOrbs.forEach((o,i) => {
      if(!o.visible) return;
      const a = o.userData.angle + t*4.0;
      const r = o.userData.radius*(1.0+sin(t*3+i)*0.3);
      o.position.set(sin(a)*r, o.userData.height+sin(t*2+i)*0.2, cos(a)*r);
    });
    if(p.gem) { p.gem.rotation.y = t*4; }
  }
  else if(currentAnim === 'die') {
    const fall = Math.min(t*0.8, Math.PI/2);
    h.group.rotation.x = fall;
    h.group.position.y = -sin(fall)*0.3;
    if(p.armR) p.armR.rotation.z = fall*0.5;
    if(p.armL) p.armL.rotation.z = -fall*0.5;
  }
}

// ─── SPELL EFFECTS ────────────────────────────────────────────────────────────
const effects = [];

function addEffect(obj, duration, onTick, onDone) {
  effects.push({obj, duration, elapsed:0, onTick, onDone});
  scene.add(obj);
}

function tickEffects(dt) {
  for(let i=effects.length-1; i>=0; i--) {
    const e = effects[i];
    e.elapsed += dt;
    e.onTick && e.onTick(e.elapsed/e.duration, e.elapsed);
    if(e.elapsed >= e.duration) {
      scene.remove(e.obj);
      e.onDone && e.onDone();
      effects.splice(i,1);
    }
  }
}

function announce(text, color='#ffcc44') {
  const el = document.getElementById('announcer');
  el.textContent = text;
  el.style.color = color;
  el.style.opacity = '1';
  setTimeout(()=>{ el.style.opacity='0'; }, 1800);
}

function showDamage(val, color='#ffffff') {
  const wrap = document.getElementById('dmg-overlay');
  const el = document.createElement('div');
  el.className = 'dmg-num';
  el.style.color = color;
  el.style.left = (40+Math.random()*20)+'%';
  el.style.top = (20+Math.random()*20)+'%';
  el.textContent = (Math.random()<0.05?'MISS':'–'+val);
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 1200);
}

function castFrostNova() {
  announce('FROST NOVA!','#88eeff');
  const g = new THREE.Group();
  // Expanding ring
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.1,0.04,8,32), glowMat(0x00ddff,3));
  ring.rotation.x = Math.PI/2; ring.position.y = 0.1; g.add(ring);
  // Ice spikes rising
  for(let i=0;i<8;i++){
    const a = (i/8)*Math.PI*2;
    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.06,0.30,5), glowMat(0x88eeff,2));
    spike.position.set(Math.cos(a)*0.3, 0, Math.sin(a)*0.3);
    g.add(spike);
  }
  addEffect(g, 1.2, (frac)=>{
    const s = frac*2.5;
    ring.scale.set(s,s,s);
    ring.material.emissiveIntensity = (1-frac)*3;
    g.children.slice(1).forEach((sp,i)=>{
      sp.position.y = frac*0.5;
      sp.scale.setScalar(1-frac*0.5);
    });
  });
  showDamage(225,'#88eeff');
}

function castChainFrost() {
  announce('CHAIN FROST!','#00ffcc');
  const orb = new THREE.Mesh(new THREE.IcosahedronGeometry(0.12,1), glowMat(0x00ffee,3));
  orb.position.set(0, 1.2, 0);
  addEffect(orb, 1.5, (frac,t)=>{
    orb.position.set(Math.sin(t*8)*0.8, 1.0+Math.cos(t*6)*0.3, frac*2.5-0.5);
    orb.rotation.y = t*5;
    orb.material.emissiveIntensity = 3*(1-frac*0.5);
  });
  showDamage(370,'#00ffee');
}

function castAssassinate() {
  announce('ASSASSINATE!','#ffee22');
  const mat = new THREE.LineBasicMaterial({color:0xffee44});
  const pts = [new THREE.Vector3(0.4,1.0,0.9), new THREE.Vector3(1.4,0.85,0)];
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat);
  addEffect(line, 0.4, (frac)=>{ mat.opacity=1-frac; }, ()=>{ showDamage(505,'#ffee22'); });
  // Muzzle flash
  const h = heroObjects[currentHero];
  if(h && h.parts.muzzle){ h.parts.muzzle.visible=true; setTimeout(()=>{ if(h.parts.muzzle) h.parts.muzzle.visible=false; },120); }
}

function castShrapnel() {
  announce('SHRAPNEL!','#ffcc44');
  const g = new THREE.Group();
  for(let i=0;i<12;i++){
    const sh = new THREE.Mesh(new THREE.BoxGeometry(0.06,0.06,0.06), stdMat(0x888866,0.6,0.5));
    sh.position.set((Math.random()-0.5)*0.8, 0.1+Math.random()*0.4, (Math.random()-0.5)*0.8+1.0);
    sh.userData.vy = 0.8+Math.random()*0.6;
    sh.userData.vx = (Math.random()-0.5)*0.5;
    sh.userData.vz = (Math.random()-0.5)*0.5;
    g.add(sh);
  }
  addEffect(g, 1.2, (frac,t)=>{
    g.children.forEach(sh=>{
      sh.position.y += sh.userData.vy*0.016-0.012;
      sh.position.x += sh.userData.vx*0.012;
      sh.position.z += sh.userData.vz*0.012;
      sh.rotation.x += 0.1; sh.rotation.y += 0.08;
      if(sh.position.y < 0) sh.position.y = 0;
    });
  });
}

function castElderDragon() {
  announce('ELDER DRAGON FORM!','#ff6600');
  const colors = [0x00ff44, 0xff2200, 0x0088ff];
  colors.forEach((c,i)=>{
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.5+i*0.15, 0.04, 8, 32), glowMat(c,3));
    ring.rotation.x = Math.PI/2;
    ring.position.y = 0.8;
    addEffect(ring, 1.5+i*0.3, (frac)=>{
      ring.scale.setScalar(1+frac*0.5);
      ring.material.emissiveIntensity = (1-frac)*3;
      ring.position.y = 0.8+frac*0.8;
    });
  });
}

function castRequiem() {
  announce('REQUIEM OF SOULS!','#ff2200');
  const g = new THREE.Group();
  for(let i=0;i<12;i++){
    const a = (i/12)*Math.PI*2;
    const mat = new THREE.LineBasicMaterial({color:0xff3300});
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0,1.0,0), new THREE.Vector3(Math.cos(a)*0.1, 1.0, Math.sin(a)*0.1)
    ]), mat);
    line.userData.angle = a;
    g.add(line);
  }
  addEffect(g, 2.0, (frac)=>{
    const radius = frac < 0.5 ? frac*2*3.5 : (1-frac)*2*3.5;
    g.children.forEach(line=>{
      const a = line.userData.angle;
      const pts = [new THREE.Vector3(0,1.0,0), new THREE.Vector3(Math.cos(a)*radius,1.0,Math.sin(a)*radius)];
      line.geometry.setFromPoints(pts);
    });
  });
  showDamage(640,'#ff4400');
}

function castWindrun() {

  const g = new THREE.Group();

    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.25+i*0.1,0.02,6,20), glowMat(0x44ffcc,2));

function castBreatheFire() {

function spawnBullet() {
  const mat = new THREE.LineBasicMaterial({color:0xffee88});
  const pts = [new THREE.Vector3(0.3,0.96,0.9), new THREE.Vector3(1.4,0.6,0)];

function spawnArrow() {

  arw.rotation.z = Math.PI/2;
  arw.position.set(0.3,0.9,0);
  addEffect(arw, 0.3, (frac)=>{
    arw.position.x = 0.3+frac*1.5;
    arw.position.z = frac*(-0.8);
    arw.position.y = 0.9;
  });
}

function castHeroSpell(key) {
  const hero = HEROES[currentHero];
  const skill = hero.skills.find(s=>s.key===key);
  if(skill){ setAnim(skill.anim||'castQ'); }
  // Hero-specific effects
  if(currentHero===0){
    if(key==='Q') castFrostNova();
    else if(key==='E') castChainFrost();
  } else if(currentHero===1){
    if(key==='Q') castShrapnel();
    else if(key==='R') castAssassinate();
    else if(key==='W'||key==='E') { showDamage(80,'#ffcc44'); announce('HEADSHOT!','#ffcc44'); }
  } else if(currentHero===2){
    if(key==='Q') { announce('DRAGON BLOOD','#ff4400'); }
    else if(key==='W') castDragonTail();
    else if(key==='E') castBreatheFire();
    else if(key==='R') castElderDragon();
  } else if(currentHero===3){
    if(key==='Q') castShadowraze();
    else if(key==='R') castRequiem();
    else if(key==='W'||key==='E') { announce('DARK PRESENCE','#660033'); }
  } else if(currentHero===4){
    if(key==='Q'||key==='W'||key==='E') castWindrun();
    else if(key==='R') castFocusFire();
  }
  // Hit sparks on dummy
  spawnHitSparks();
}

function spawnHitSparks() {
  const g = new THREE.Group();
  for(let i=0;i<8;i++){
    const sp = new THREE.Mesh(new THREE.SphereGeometry(0.04,4,4), glowMat(0xffaa22,3));
    const a = Math.random()*Math.PI*2;
    sp.userData.vx = Math.cos(a)*0.04;
    sp.userData.vy = 0.04+Math.random()*0.04;
    sp.userData.vz = Math.sin(a)*0.04;
    g.add(sp);
  }
  g.position.set(1.4,0.5,0);
  addEffect(g, 0.5, (frac)=>{
    g.children.forEach(sp=>{
      sp.position.x += sp.userData.vx;
      sp.position.y += sp.userData.vy;
      sp.position.z += sp.userData.vz;
      sp.userData.vy -= 0.003;
      sp.material.emissiveIntensity = (1-frac)*3;
      sp.scale.setScalar(1-frac);
    });
  });
}

// ─── CAMERA ORBIT ─────────────────────────────────────────────────────────────
function updateCamera() {
  const x = cameraDist * Math.sin(cameraTheta) * Math.cos(cameraPhi);
  const y = cameraDist * Math.sin(cameraPhi) + 1.2;
  const z = cameraDist * Math.cos(cameraTheta) * Math.cos(cameraPhi);
  camera.position.set(x, Math.max(0.3, y), z);
  camera.lookAt(0, 1.2, 0);
}

canvas.addEventListener('mousedown', e=>{ isDragging=true; lastMX=e.clientX; lastMY=e.clientY; });
window.addEventListener('mouseup', ()=>{ isDragging=false; });
window.addEventListener('mousemove', e=>{
  if(!isDragging) return;
  const dx = e.clientX-lastMX, dy = e.clientY-lastMY;
  cameraTheta -= dx*0.008;
  cameraPhi = Math.max(-0.2, Math.min(1.2, cameraPhi - dy*0.006));
  lastMX = e.clientX; lastMY = e.clientY;
  updateCamera();
});
canvas.addEventListener('wheel', e=>{
  cameraDist = Math.max(1.5, Math.min(8, cameraDist + e.deltaY*0.005));
  updateCamera(); e.preventDefault();
}, {passive:false});

// Touch support
let touchStart = null;
canvas.addEventListener('touchstart', e=>{ if(e.touches.length===1){ touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; } });
canvas.addEventListener('touchmove', e=>{
  if(e.touches.length===1 && touchStart){
    const dx=e.touches[0].clientX-touchStart.x, dy=e.touches[0].clientY-touchStart.y;
    cameraTheta -= dx*0.008; cameraPhi = Math.max(-0.2,Math.min(1.2,cameraPhi-dy*0.006));
    touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
    updateCamera();
  }
  e.preventDefault();
},{passive:false});

// ─── UI ────────────────────────────────────────────────────────────────────────
function buildPortraits() {
  const strip = document.getElementById('portrait-strip');
  strip.innerHTML = '';
  HEROES.forEach((h,i)=>{
    const p = document.createElement('div');
    p.className = 'portrait' + (i===currentHero?' active':'');
    p.innerHTML = `<div class="port-icon">${PORTRAIT_ICONS[i]}</div><div>${h.name.substring(0,6)}</div>`;
    p.addEventListener('click', ()=>showHero(i));
    strip.appendChild(p);
  });
}

function updatePortraits() {
  document.querySelectorAll('.portrait').forEach((p,i)=>{ p.classList.toggle('active',i===currentHero); });
}

function updateUI() {
  const h = HEROES[currentHero];
  const lvl = parseInt(document.getElementById('lvlSlider').value)||1;
  document.getElementById('heroNameTitle').textContent = h.name.toUpperCase();
  document.getElementById('hero-title').textContent = h.name.toUpperCase();
  document.getElementById('hero-sub').textContent = h.sub;

  const hp = h.baseHP + h.hpLvl*(lvl-1);
  const mp = h.baseMana + h.manaLvl*(lvl-1);
  document.getElementById('hpBar').style.width = '100%';
  document.getElementById('mpBar').style.width = '100%';
  document.getElementById('hpVal').textContent = hp+' / '+hp;
  document.getElementById('mpVal').textContent = mp+' / '+mp;

  const ab = document.getElementById('attrsBox');
  ab.innerHTML = '';
  [['str','❤️','STR',h.str,h.strG],['agi','⚡','AGI',h.agi,h.agiG],['int','🔮','INT',h.int,h.intG]].forEach(([key,icon,label,val,gain])=>{
    const d = document.createElement('div');
    d.className = 'attr-box'+(h.primary===key?' primary':'');
    d.innerHTML = `<div class="attr-icon">${icon}</div><div class="attr-val">${val}</div><div class="attr-gain">+${gain}/lvl</div>`;
    ab.appendChild(d);
  });

  const sg = document.getElementById('statGrid');
  sg.innerHTML = [
    ['Damage',h.dmg],['Armor',h.armor],['Range',h.range],['Move Spd',h.ms]
  ].map(([k,v])=>`<div class="stat-item"><span>${k}</span><span>${v}</span></div>`).join('');

  const skGrid = document.getElementById('skillGrid');
  skGrid.innerHTML = '';
  h.skills.forEach(sk=>{
    const btn = document.createElement('button');
    btn.className = 'skill-btn';
    btn.innerHTML = `<div class="skill-key">[${sk.key}]</div><div class="skill-name">${sk.name}</div><div class="skill-meta">${sk.meta}</div>`;
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.skill-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('skill-info').innerHTML = `<div class="si-name">${sk.name}</div>${sk.desc}`;
      castHeroSpell(sk.key);
    });
    skGrid.appendChild(btn);
  });
}

// ─── RESIZE ────────────────────────────────────────────────────────────────────
function resize() {
  const w = canvas.parentElement.clientWidth;
  const h = canvas.parentElement.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

// ─── KEYBOARD ─────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e=>{
  const k = e.key.toUpperCase();
  if(k==='Q'||k==='W'||k==='E'||k==='R') castHeroSpell(k);
  else if(k==='ARROWLEFT'||k==='ARROWUP') showHero((currentHero+HEROES.length-1)%HEROES.length);
  else if(k==='ARROWRIGHT'||k==='ARROWDOWN') showHero((currentHero+1)%HEROES.length);
  else if(k===' ') { setAnim('attack'); e.preventDefault(); }
  else if(k==='I') setAnim('idle');
  else if(k==='D') setAnim('die');
});

// ─── ANIMATION BUTTONS ────────────────────────────────────────────────────────
document.querySelectorAll('.anim-btn').forEach(b=>{
  b.addEventListener('click', ()=>setAnim(b.dataset.anim));
});
document.getElementById('prevBtn').addEventListener('click', ()=>showHero((currentHero+HEROES.length-1)%HEROES.length));
document.getElementById('nextBtn').addEventListener('click', ()=>showHero((currentHero+1)%HEROES.length));

// Sliders
document.getElementById('lvlSlider').addEventListener('input', function(){ document.getElementById('lvlVal').textContent=this.value; updateUI(); });
document.getElementById('atkSlider').addEventListener('input', function(){ document.getElementById('atkVal').textContent=this.value; attackSpeedMult=this.value/100; });

// ─── MAIN LOOP ────────────────────────────────────────────────────────────────
let lastTime = 0;
const ringColors = [0x4444ff,0xff4400,0x00ffcc,0xffcc00,0x88ffcc];
let ringColorT = 0;

function animate(time) {
  requestAnimationFrame(animate);
  const dt = Math.min((time-lastTime)/1000, 0.05);
  lastTime = time;

  // Auto rotate camera when idle
  if(isAutoRotate) {
    cameraTheta += dt*0.3;
    updateCamera();
  }

  // Ring color pulse
  ringColorT += dt*0.5;
  const rc = ringColors[currentHero];
  const pulse = 1.2+Math.sin(time*0.002)*0.4;
  ringMesh.material.emissiveIntensity = pulse;
  heroLight.intensity = 0.8+Math.sin(time*0.003)*0.3;

  animateHero(dt);
  tickEffects(dt);

  // Dummy bob
  dummyGroup.position.y = Math.sin(time*0.002)*0.02;

  renderer.render(scene, camera);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
buildPortraits();
buildAllHeroes();
updateUI();
resize();
updateCamera();
animate(0);
</script>
